<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zboruri indisponibile</title>

  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family:'Exo 2', sans-serif;
      background: linear-gradient(180deg,#eaf4ff,#f8fbff);
      color:#0f172a;
      padding:24px;
    }
    .card{
      width:min(680px, 100%);
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(15,23,42,0.10);
      border-radius:20px;
      padding:38px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.14);
      text-align:center;
    }
    h1{ margin:0 0 10px; font-size:34px; font-weight:900; }
    p{ margin:0; font-size:18px; color:#475569; }
    a{
      display:inline-block;
      margin-top:22px;
      padding:12px 18px;
      border-radius:14px;
      background:#2563eb;
      color:white;
      text-decoration:none;
      font-weight:800;
      transition:.2s;
    }
    a:hover{ transform:translateY(-2px); background:#1d4ed8; }
  </style>
</head>

<body>
  <div class="card">
    <h1>✈️ Momentan nu există zboruri</h1>
    <p>Nu avem încă rute disponibile pentru această țară.</p>
    <a href="index.html">Înapoi la țări</a>
  </div>
</body>
</html>
